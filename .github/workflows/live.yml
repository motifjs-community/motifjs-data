name: Live services

# The adapters against public demo services (OData Northwind and TripPin, DummyJSON, JSONPlaceholder).
# Not part of CI: a service being down must not block a pull request.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live
